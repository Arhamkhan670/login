<style>
body{

.container{

     width: 350px;
     height: 400px;

     border-radius: 15px;

     flex-direction: column;

     justify-content: center;
     margin-left: 38%;
     margin-top: 15%;
     
    
    }




.box h2{

        margin-bottom: 15px;

        font-weight: 400px;
        font-size: 20px;
    
}
.box input{
        width: 280px;
        height: 32px;
        display: flex;
        align-items: center;
        border: 1px solid rgba(255,225,225,0.7);
        border-radius: 20px;
        margin-bottom: 15px;
        padding-left: 15px;

}

}



.box2{
     font-size: 12px;

}

     width: 300px;

     
}
.box2 a{
    
    text-decoration: none;

}
#btn{
     border: solid 2px;
     border-radius: 20px;
     width: 280px;

}


.box3{
     color: antiquewhite;
     font-size: 12px;

}


.box3 a{
    text-decoration: none;
    color: rgb(243, 227, 227);
    
}



.box input:hover{

}


.box2:hover{
     color: chartreuse;
}

}

}

}

</head>

 <lable><input type="checkbox"> Remember Me?</lable>
